[DLAA]
; Menu language: en = English (default), ko = Korean
Language=en

; 1 = use DLAA, 0 = the game's own TAA (can also be toggled in game with ToggleKey)
Enabled=1

; DLSS preset: 11 = K (default, recommended), 0 = Default (driver choice),
; 5 = E, 6 = F (older CNN models, deprecated), 10 = J, 12 = L, 13 = M
; Any other value is treated as K.
Preset=11

; Adaptive sharpening applied after DLAA, 0-100 (0 = off)
Sharpness=0

; 1 = skip the slow-motion wreck (crash) camera. Takedown and spike strip cameras still play.
; Do not enable this together with ZPatch's NoCrashCams.
NoCrashCams=0

; Hotkeys (Windows virtual-key codes, 119 = F8, 120 = F9)
; MenuKey: open/close the settings menu
MenuKey=119
ToggleKey=120

; TAA passes narrower than this are ignored (rear-view mirror etc.)
MinWidth=1280

; 1 = write the jitter value of every frame to the log (for troubleshooting)
VerboseLog=0
